name: Source evidence integrity
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify-e01-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify raw source and all six JSON datasets
        run: node scripts/validate.mjs
