name: Source evidence integrity
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify-e01-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Check all-episode review JavaScript syntax
        run: node --check action-review.js
      - name: Check unified twins tracker syntax
        run: node --check unified-pair-tracker.js
      - name: Verify twins source ranges, section hashes and restored ledgers
        run: python3 scripts/validate_twins_tracker.py
      - name: Check twins episode scopes, attribution controls and exports
        run: node scripts/test_twins_tracker.mjs
      - name: Verify all 69 episode source ledgers and checked action spans
        run: python3 scripts/validate_female_action_review.py
      - name: Check source validator syntax
        run: node --check scripts/validate.mjs
      - name: Verify complete E01-E02 source integrity
        run: node scripts/validate.mjs
      - name: Verify relationship pair indexes
        run: node scripts/validate_relationships.mjs
      - name: Verify E05–E06 director freeze, line coverage and evidence offsets
        run: node scripts/validate_director_cycle.mjs
