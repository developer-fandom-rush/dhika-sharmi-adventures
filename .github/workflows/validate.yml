name: Source evidence integrity
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify-e01-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Check source validator syntax
        run: node --check scripts/validate.mjs
      - name: Verify raw source, six JSON datasets and AI Director forecast
        run: node scripts/validate.mjs
